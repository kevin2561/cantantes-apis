spring.application.name=apirest

# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Artistas;integratedSecurity=true;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Artistas;encrypt=true;trustServerCertificate=true;

spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

#Configuración para JPA
spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect

#Es útil en desarrollo, pero no es 100% confiable para mantener la BD limpia o precisa (✔ crea tablas, ✔ agrega columnas, ❌no cambia el tipo de dato, ❌no elimina tablas).
spring.jpa.hibernate.ddl-auto=update  

# spring.jpa.hibernate.ddl-auto=none  //Solo usa lo que ya está en la base de datos y mantiene la conexión entre tu código y las tablas


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
